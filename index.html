<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07152f">
<title>Page Not Available</title>
<style>
  :root { color-scheme: dark; --blue:#58baff; --muted:#a8b9d7; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; }
  body {
    min-height:100vh; overflow:hidden; display:grid; place-items:center;
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:#f5f8ff;
    background:radial-gradient(ellipse at 50% 38%,#12366c 0%,#0a2045 35%,#07152f 72%,#040b1b 100%);
  }
  .stars,.stars::before,.stars::after { position:fixed; inset:0; pointer-events:none; content:""; }
  .stars {
    background-image:radial-gradient(2px 2px at 20px 30px,#fff 98%,transparent),radial-gradient(1px 1px at 90px 80px,#9bd8ff 98%,transparent),radial-gradient(1.5px 1.5px at 160px 130px,#fff 98%,transparent),radial-gradient(1px 1px at 230px 45px,#c3e8ff 98%,transparent);
    background-size:270px 190px; opacity:.5; animation:twinkle 4s ease-in-out infinite alternate;
  }
  .stars::before { background-image:radial-gradient(1px 1px at 70px 110px,#fff 98%,transparent),radial-gradient(2px 2px at 210px 170px,#80caff 98%,transparent); background-size:310px 230px; opacity:.6; }
  .stars::after { background:linear-gradient(120deg,transparent 35%,#56aaff08 50%,transparent 65%); animation:drift 12s linear infinite; }
  main { position:relative; z-index:1; width:min(92%,720px); padding:36px 20px 48px; text-align:center; }
  .scene { position:relative; height:280px; display:grid; place-items:center; margin:0 auto 8px; }
  .planet-ring { position:absolute; width:230px; height:68px; border:1px solid #78c9ff55; border-radius:50%; transform:rotate(-18deg); box-shadow:0 0 25px #47aaff18; }
  .planet { position:absolute; width:115px; height:115px; border-radius:50%; right:calc(50% - 130px); top:26px; background:radial-gradient(circle at 30% 25%,#8ad8ff,#357acb 45%,#17366f 75%); box-shadow:inset -12px -12px 25px #07142c99,0 0 35px #4dafff25; opacity:.9; }
  .planet::after { content:""; position:absolute; width:100%; height:100%; border-radius:50%; background:repeating-linear-gradient(25deg,transparent 0 13px,#122d60aa 14px 19px,transparent 20px 28px); }
  .astronaut { width:175px; height:200px; position:relative; z-index:2; animation:float 4.2s ease-in-out infinite; filter:drop-shadow(0 18px 24px #0005); }
  .helmet { position:absolute; width:112px; height:105px; left:32px; top:12px; border-radius:48% 48% 43% 43%; background:linear-gradient(135deg,#fff 0%,#dcecff 45%,#8baed8 100%); border:5px solid #eff7ff; box-shadow:inset -9px -8px 0 #7596bf55,0 0 0 3px #6cbaff33; }
  .visor { position:absolute; inset:16px 12px 18px; border-radius:48%; background:linear-gradient(140deg,#1c5a91,#081a3b 70%); border:3px solid #9ddcff; overflow:hidden; box-shadow:inset 0 0 17px #55b9ff55; }
  .visor::before { content:""; position:absolute; width:42px; height:70px; left:8px; top:-12px; transform:rotate(28deg); background:linear-gradient(90deg,#fff7,transparent); border-radius:50%; }
  .body-suit { position:absolute; width:100px; height:80px; left:38px; top:103px; border-radius:28px 28px 23px 23px; background:linear-gradient(130deg,#fff,#b9d5f5 70%,#779bc9); border:4px solid #edf6ff; }
  .chest { position:absolute; width:38px; height:28px; top:19px; left:27px; border-radius:8px; background:#173b6d; border:2px solid #7bcaff; }
  .chest::after { content:""; position:absolute; width:6px; height:6px; right:5px; top:5px; border-radius:50%; background:#6fffd1; box-shadow:0 0 8px #6fffd1; }
  .arm { position:absolute; top:111px; width:28px; height:58px; border-radius:18px; background:linear-gradient(90deg,#8eafd8,#f4f8ff); border:3px solid #e9f4ff; }
  .arm.left { left:19px; transform:rotate(25deg); }
  .arm.right { right:17px; transform:rotate(-28deg); }
  .leg { position:absolute; top:168px; width:31px; height:25px; background:#c3d9f5; border:3px solid #f1f7ff; border-radius:8px 8px 13px 13px; }
  .leg.left { left:48px; transform:rotate(10deg); }
  .leg.right { right:45px; transform:rotate(-10deg); }
  .spark { position:absolute; color:#a6dcff; animation:twinkle 2s ease-in-out infinite alternate; }
  .s1 { left:15%; top:25%; font-size:22px; } .s2 { right:15%; top:35%; font-size:17px; animation-delay:.7s; }
  .s3 { left:25%; bottom:20%; font-size:13px; animation-delay:1.1s; } .s4 { right:24%; bottom:24%; font-size:23px; animation-delay:.3s; }
  .eyebrow { color:#8fcfff; text-transform:uppercase; letter-spacing:.22em; font-size:.76rem; font-weight:700; }
  h1 { margin:12px 0 10px; font-size:clamp(2.1rem,6vw,3.6rem); line-height:1.08; letter-spacing:-.045em; }
  h1 span { color:#70c5ff; text-shadow:0 0 28px #49aaff44; }
  p { margin:0 auto; max-width:470px; color:var(--muted); line-height:1.75; font-size:1rem; }
  .actions { display:flex; justify-content:center; flex-wrap:wrap; gap:12px; margin-top:28px; }
  a { min-width:145px; text-decoration:none; border-radius:999px; padding:13px 21px; font-size:.92rem; font-weight:700; transition:transform .2s,background .2s,box-shadow .2s; }
  a:hover { transform:translateY(-3px); }
  .primary { color:#06162f; background:linear-gradient(135deg,#a8e1ff,#55b8ff); box-shadow:0 8px 25px #42aaff33; }
  .primary:hover { box-shadow:0 10px 32px #42aaff55; }
  .secondary { color:#d7e9ff; border:1px solid #6c9bce66; background:#ffffff08; }
  .secondary:hover { background:#ffffff12; }
  .code { margin-top:30px; color:#6e8bb4; font-size:.75rem; letter-spacing:.12em; }
  @keyframes float { 0%,100%{transform:translateY(0) rotate(-3deg)} 50%{transform:translateY(-15px) rotate(3deg)} }
  @keyframes twinkle { from{opacity:.35} to{opacity:.9} }
  @keyframes drift { from{transform:translateX(-25%)} to{transform:translateX(25%)} }
  @media(max-width:480px) { .scene{height:245px;transform:scale(.9);margin-bottom:-2px} main{padding:22px 12px 30px} p{font-size:.94rem} .planet{right:calc(50% - 115px)} }
  @media(prefers-reduced-motion:reduce) { *,*::before,*::after{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="stars" aria-hidden="true"></div>
<main>
  <div class="scene" aria-hidden="true">
    <div class="planet"></div>
    <div class="planet-ring"></div>
    <span class="spark s1">✦</span><span class="spark s2">✧</span>
    <span class="spark s3">✦</span><span class="spark s4">✧</span>
    <div class="astronaut">
      <div class="helmet"><div class="visor"></div></div>
      <div class="arm left"></div><div class="arm right"></div>
      <div class="body-suit"><div class="chest"></div></div>
      <div class="leg left"></div><div class="leg right"></div>
    </div>
  </div>
  <div class="eyebrow">Houston, we have a problem</div>
  <h1>Page <span>Not Available</span></h1>
  <p>Looks like this page has drifted into deep space. It may have moved, been removed, or the link might be incorrect.</p>
  <div class="actions">
    <a class="primary" href="/" id="homeButton">← Back to Home</a>
    <a class="secondary" href="#" id="backButton">Go Back</a>
  </div>
  <div class="code">ERROR 404 &nbsp;·&nbsp; LOST IN SPACE</div>
</main>
<script>
  // "Go Back" returns to the previous page, or falls back to home.
  document.getElementById("backButton").addEventListener("click", function (event) {
    event.preventDefault();
    if (window.history.length > 1) window.history.back();
    else window.location.href = "/";
  });
</script>
</body>
</html>
