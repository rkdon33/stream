
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KeraStreams</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at top, #123b78, #050d20 70%);
  font-family: Arial, sans-serif;
  color: white;
}

.container {
  width: 90%;
  max-width: 420px;
  padding: 30px 24px;
  border: 1px solid rgba(130,190,255,0.2);
  border-radius: 24px;
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 15px 50px rgba(0,0,0,0.3);
}

h1 {
  margin: 0 0 30px;
  font-size: 27px;
  letter-spacing: -1px;
}

h1 span {
  color: #60aaff;
}

.stream-button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 20px;
  border: 1px solid rgba(120,190,255,0.3);
  border-radius: 16px;
  background: rgba(35,110,210,0.18);
  color: white;
  text-decoration: none;
  font-size: 16px;
  font-weight: bold;
  transition: 0.25s ease;
}

.stream-button:hover {
  transform: translateY(-3px);
  background: rgba(35,130,255,0.3);
  border-color: #60aaff;
  box-shadow: 0 8px 25px rgba(35,130,255,0.15);
}

.arrow {
  color: #60aaff;
  font-size: 22px;
}
</style>
</head>

<body>
  <main class="container">
    <h1>Kera<span>Streams</span></h1>

    <nav id="streams">
      <!-- Add more buttons here using JavaScript -->
    </nav>
  </main>

<script>
// Change this URL to your destination page.
const streams = [
  {
    name: "Willow Live",
    url: "https://terobaukostream.pages.dev/livesports/willow"
  }
];

const container = document.getElementById("streams");

streams.forEach(stream => {
  const button = document.createElement("a");
  button.className = "stream-button";
  button.href = stream.url;
  button.innerHTML = `
    <span>${stream.name}</span>
    <span class="arrow">↗</span>
  `;
  container.appendChild(button);
});

// To add another button, add another object to streams:
// { name: "Stream 02", url: "stream-02.html" }
</script>
</body>
</html>
